<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SERVITEC · Stock</title>
<link rel="icon" href="logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#ffffff;--panel:#f7f8fa;--panel2:#ffffff;--border:#e4e7ec;
    --text:#15181d;--muted:#6b7280;--accent:#e30713;--accent-dark:#b3050f;
    --mucho:#12833c;--medio:#b07d00;--poco:#e06c00;--no:#98a2b3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;padding:20px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:1100px;margin:0 auto;}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:3px solid var(--accent);}
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .brand>div{min-width:0;}
  .brand img{width:46px;height:46px;border-radius:10px;display:block;}
  h1{font-size:20px;letter-spacing:.5px;margin:0;text-transform:uppercase;}
  h1 span{color:var(--accent);}
  .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .admin-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;flex:0 0 auto;}
  .admin-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* Carrusel de carteles en la portada */
  .hero{position:relative;margin-bottom:20px;border-radius:12px;overflow:hidden;
        background:#000;border-top:4px solid var(--accent);height:380px;}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;
            opacity:0;transition:opacity .9s ease;}
  .hero img.on{opacity:1;}
  .hero .puntos{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:7px;z-index:2;}
  .hero .puntos b{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer;
                  transition:background .2s,transform .2s;box-shadow:0 0 3px rgba(0,0,0,.5);}
  .hero .puntos b.on{background:#fff;transform:scale(1.25);}

  .upload-section{display:none;margin-bottom:18px;}
  .foto-info{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);
             border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--muted);}
  .foto-info b{color:var(--text);}
  .upload-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .upload-box{background:var(--panel);border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;}
  .upload-box.loaded{border-color:var(--mucho);border-style:solid;}
  .upload-box h3{margin:0 0 8px 0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .upload-box input{display:none;}
  .upload-btn{display:inline-block;background:var(--accent);color:#fff;font-weight:700;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:13px;}
  .upload-btn:hover{background:var(--accent-dark);}
  .upload-status{font-size:12px;margin-top:8px;min-height:16px;}
  .upload-status.ok{color:var(--mucho);}
  .upload-status.saving{color:var(--medio);}
  .upload-status.error{color:var(--accent);}

  .stats{display:none;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
  .stat .n{font-size:22px;font-weight:700;}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .stat:first-child .n{color:var(--accent);}
  .stat.mucho .n{color:var(--mucho);}
  .stat.medio .n{color:var(--medio);}
  .stat.poco .n{color:var(--poco);}
  .stat.no .n{color:var(--no);}

  /* Pantalla principal: secciones */
  .home{display:none;}
  .home-title{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 12px 0;font-weight:700;}
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .cat{position:relative;text-align:left;background:var(--panel2);border:1px solid var(--border);
       border-left:5px solid var(--c);border-radius:10px;padding:14px 14px 14px 16px;cursor:pointer;
       font-family:inherit;box-shadow:0 1px 3px rgba(0,0,0,.07);transition:box-shadow .15s,transform .1s;}
  .cat:hover{box-shadow:0 6px 16px rgba(0,0,0,.14);transform:translateY(-2px);}
  .cat .cn{font-size:14px;font-weight:700;color:var(--c);line-height:1.3;}
  .cat .cc{font-size:12px;color:var(--muted);margin-top:6px;}
  .cat .cc b{color:var(--text);font-weight:700;}

  /* Barra de la seccion abierta */
  .secbar{display:none;align-items:center;gap:12px;margin-bottom:14px;}
  .back-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;flex:0 0 auto;}
  .back-btn:hover{border-color:var(--accent);color:var(--accent);}
  .secbar h2{margin:0;font-size:16px;font-weight:700;}

  .controls{display:none;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  input[type=text]{flex:1 0 100%;background:var(--panel2);border:2px solid var(--border);color:var(--text);
                   padding:15px 18px;border-radius:10px;font-size:17px;font-weight:500;}
  input[type=text]::placeholder{color:var(--muted);font-weight:400;}
  input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(227,7,19,.12);}
  select:focus{outline:none;border-color:var(--accent);}
  select{flex:1 1 200px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:8px;font-size:14px;}

  table{width:100%;border-collapse:collapse;display:none;}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--border);}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;}
  tbody tr:hover{background:var(--panel);}
  .thumb{width:46px;height:46px;object-fit:cover;border-radius:6px;border:1px solid var(--border);background:var(--panel);display:block;cursor:zoom-in;}
  .sku{color:var(--muted);font-family:monospace;font-size:12px;}
  .precio{font-weight:600;}
  .marca{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--panel);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .badge.mucho{background:rgba(18,131,60,.12);color:var(--mucho);}
  .badge.mucho .dot{background:var(--mucho);}
  .badge.medio{background:rgba(176,125,0,.12);color:var(--medio);}
  .badge.medio .dot{background:var(--medio);}
  .badge.poco{background:rgba(224,108,0,.12);color:var(--poco);}
  .badge.poco .dot{background:var(--poco);}
  .badge.no{background:rgba(152,162,179,.15);color:#6b7280;}
  .badge.no .dot{background:var(--no);}

  .more-btn{display:none;width:100%;margin-top:14px;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;}
  .more-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* Pie: logo, Instagram y envios */
  .pie{margin-top:34px;padding:26px 16px 20px;border-top:3px solid var(--accent);text-align:center;}
  .pie img{width:180px;max-width:60%;height:auto;display:block;margin:0 auto 14px;}
  .pie a{display:inline-flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;
         font-size:15px;font-weight:700;padding:9px 16px;border:1px solid var(--border);border-radius:999px;
         transition:border-color .15s,color .15s;}
  .pie a:hover{border-color:var(--accent);color:var(--accent);}
  .pie a svg{width:20px;height:20px;flex:0 0 auto;}
  .pie .envios{margin-top:12px;font-size:14px;color:var(--muted);font-weight:600;}
  .pie .envios b{color:var(--accent);}

  .loading{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;}
  .empty{display:none;text-align:center;color:var(--muted);padding:40px;font-size:14px;}

  /* Visor de foto ampliada */
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;cursor:zoom-out;}
  .viewer.open{display:flex;}
  .viewer img{max-width:100%;max-height:82vh;border-radius:10px;background:#fff;}
  .viewer .vcap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:13px;padding:0 20px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--panel2);border:1px solid var(--border);border-top:4px solid var(--accent);border-radius:12px;padding:24px;width:280px;box-shadow:0 12px 40px rgba(0,0,0,.18);}
  .modal h3{margin:0 0 12px 0;font-size:14px;}
  .modal input[type=password]{width:100%;margin-bottom:10px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;}
  .modal-actions{display:flex;gap:8px;}
  .modal-actions button{flex:1;padding:9px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px;}
  .modal-actions button.primary{background:var(--accent);color:#fff;border:none;font-weight:600;}
  .modal-actions button.primary:hover{background:var(--accent-dark);}
  .modal-error{color:var(--accent);font-size:12px;margin-bottom:8px;display:none;}

  /* --- Telefono y tablet chica: la tabla pasa a ser una tarjeta por producto --- */
  @media(max-width:760px){
    body{padding:14px 12px;}
    header{padding-bottom:12px;margin-bottom:16px;}
    .brand img{width:38px;height:38px;border-radius:8px;}
    h1{font-size:16px;}
    .sub{font-size:11px;}

    .cats{grid-template-columns:repeat(2,1fr);gap:10px;}
    .cat{padding:11px;}
    .cat .cn{font-size:13px;}
    .cat .cc{font-size:11px;margin-top:4px;}
    .secbar h2{font-size:15px;}

    .hero{margin-bottom:16px;height:400px;}

    .upload-grid{grid-template-columns:1fr;}

    .stats{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
    .stat{padding:8px 6px;border-radius:8px;}
    .stat .n{font-size:17px;}
    .stat .l{font-size:9px;letter-spacing:.2px;}
    .stat:first-child{grid-column:1/-1;padding:10px;}
    .stat:first-child .n{font-size:22px;}

    .controls{gap:8px;}
    input[type=text]{font-size:16px;padding:14px 16px;}
    select{flex:1 1 0;min-width:0;font-size:14px;padding:11px 10px;}

    /* Cada fila de la tabla se muestra como tarjeta */
    table{display:block;}
    thead{display:none;}
    tbody{display:block;}
    tbody tr{
      display:flex;flex-wrap:wrap;align-items:center;gap:8px;
      border:1px solid var(--border);border-radius:10px;
      padding:12px;margin-bottom:10px;
    }
    tbody tr:hover{background:var(--panel2);}
    tbody td{display:block;border:none;padding:0;}
    /* Orden dentro de la tarjeta: descripcion, luego SKU + marca + estado, luego precio */
    tbody td:nth-child(1){order:0;flex:0 0 auto;}
    tbody td:nth-child(1):empty{display:none;}
    tbody td:nth-child(1) .thumb{width:62px;height:62px;}
    tbody td:nth-child(3){order:1;flex:1 1 calc(100% - 78px);font-size:14px;font-weight:600;line-height:1.35;}
    /* Sin foto, la descripcion se queda con todo el ancho de la tarjeta */
    tbody td:nth-child(1):empty + td + td{flex:1 0 100%;}
    tbody td:nth-child(2){order:2;}
    tbody td:nth-child(4){order:3;}
    tbody td:nth-child(6){order:4;margin-left:auto;}
    tbody td:nth-child(5){order:5;flex:1 0 100%;font-size:17px;color:var(--accent);}
  }

  @media(max-width:600px){
    .stat:first-child{grid-column:1/-1;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="logo.png" alt="Servitec" onerror="this.style.display='none'">
      <div>
        <h1>SERVITEC<span> · STOCK</span></h1>
        <div class="sub" id="subtitle">Cargando...</div>
      </div>
    </div>
    <button class="admin-btn" id="adminToggle">Admin</button>
  </header>

  <div class="hero" id="hero">
    <img src="hero1.jpg" class="on" alt="Servitec" onerror="this.remove()">
    <img src="hero2.jpg" alt="" loading="lazy" onerror="this.remove()">
    <img src="hero3.jpg" alt="" loading="lazy" onerror="this.remove()">
    <div class="puntos" id="heroPuntos"></div>
  </div>

  <div class="upload-section" id="uploadSection">
    <div class="foto-info" id="fotoInfo"></div>
    <div class="upload-grid">
      <div class="upload-box" id="box-gamma">
        <h3>Gamma</h3>
        <label class="upload-btn">Importar <input type="file" accept=".xls,.xlsx,.csv" data-prov="gamma"></label>
        <div class="upload-status" id="status-gamma"></div>
      </div>
      <div class="upload-box" id="box-lusqtoff">
        <h3>Lusqtoff</h3>
        <label class="upload-btn">Importar <input type="file" accept=".xls,.xlsx,.csv" data-prov="lusqtoff"></label>
        <div class="upload-status" id="status-lusqtoff"></div>
      </div>
      <div class="upload-box" id="box-omaha">
        <h3>Omaha</h3>
        <label class="upload-btn">Importar <input type="file" accept=".xls,.xlsx,.csv" data-prov="omaha"></label>
        <div class="upload-status" id="status-omaha"></div>
      </div>
      <div class="upload-box" id="box-kld">
        <h3>KLD</h3>
        <label class="upload-btn">Importar <input type="file" accept=".xls,.xlsx,.csv" data-prov="kld"></label>
        <div class="upload-status" id="status-kld"></div>
      </div>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Productos</div></div>
    <div class="stat mucho"><div class="n" id="statMucho">0</div><div class="l">Mucho</div></div>
    <div class="stat medio"><div class="n" id="statMedio">0</div><div class="l">Medio</div></div>
    <div class="stat poco"><div class="n" id="statPoco">0</div><div class="l">Poco</div></div>
    <div class="stat no"><div class="n" id="statNo">0</div><div class="l">Sin stock</div></div>
  </div>

  <div class="secbar" id="secbar">
    <button class="back-btn" id="backBtn">← Secciones</button>
    <h2 id="secTitle"></h2>
  </div>

  <div class="controls" id="controls">
    <input type="text" id="search" placeholder="Buscar por SKU o descripción...">
    <select id="filterEstado">
      <option value="">Todos los estados</option>
      <option value="mucho">Mucho</option>
      <option value="medio">Medio</option>
      <option value="poco">Poco</option>
      <option value="no">Sin stock</option>
    </select>
    <select id="filterProv">
      <option value="">Todas las marcas</option>
      <option value="gamma">Gamma</option>
      <option value="lusqtoff">Lusqtoff</option>
      <option value="omaha">Omaha</option>
      <option value="kld">KLD</option>
    </select>
  </div>

  <div class="home" id="home">
    <p class="home-title">Elegí una sección</p>
    <div class="cats" id="cats"></div>
  </div>

  <table id="table">
    <thead><tr><th id="thFoto">Foto</th><th>SKU</th><th>Descripción</th><th>Marca</th><th>Precio Lista</th><th>Estado</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <button class="more-btn" id="moreBtn">Mostrar más</button>

  <div class="loading" id="loadingState">Cargando stock...</div>
  <div class="empty" id="emptyState">Sin resultados para ese filtro.</div>

  <footer class="pie">
    <img src="logo-full.jpg" alt="Servitec MG SRL · Distribuidor" onerror="this.remove()">
    <a href="https://instagram.com/servitec_mg" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"></circle>
      </svg>
      servitec_mg
    </a>
    <div class="envios">Envíos a <b>todo el país</b></div>
  </footer>
</div>

<div class="viewer" id="viewer">
  <img id="viewerImg" src="" alt="">
  <div class="vcap" id="viewerCap"></div>
</div>

<div class="modal-overlay" id="pwModal">
  <div class="modal">
    <h3>Acceso admin</h3>
    <div class="modal-error" id="pwError">Clave incorrecta</div>
    <input type="password" id="pwInput" placeholder="Clave">
    <div class="modal-actions">
      <button id="pwCancel">Cancelar</button>
      <button class="primary" id="pwConfirm">Entrar</button>
    </div>
  </div>
</div>

const OTROS = 'Otros';

// --- Fotos de producto (Supabase Storage) -----------------------------
// El bucket se lee UNA sola vez al arrancar y se arma un indice por SKU.
// Asi no se piden fotos que no existen: el SKU sin foto simplemente no la muestra.
const BUCKET_FOTOS = 'fotos';
let fotos = {};

// Clave floja: ignora mayusculas, espacios, puntos y guiones. De esta forma
// da igual si el archivo se llama "OM 471.DFZ4580.jpg" o "om-471-dfz4580.webp".
function claveFoto(t){
  return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}

async function cargarFotos(){
  let offset = 0;
  try{
    while(offset < 20000){
      const r = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${BUCKET_FOTOS}`,{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`},
        body:JSON.stringify({prefix:'',limit:1000,offset,sortBy:{column:'name',order:'asc'}})
      });
      if(!r.ok) return;
      const lista = await r.json();
      if(!Array.isArray(lista) || !lista.length) return;
      lista.forEach(o=>{
        if(!o || !o.name || !/\.(jpe?g|png|webp|gif|avif)$/i.test(o.name)) return;
        const base = o.name.replace(/\.[^.]+$/,'');
        const k = claveFoto(base);
        if(k && !fotos[k]) fotos[k] = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_FOTOS}/${encodeURIComponent(o.name)}`;
      });
      if(lista.length < 1000) return;
      offset += 1000;
    }
  }catch(e){ console.warn('No se pudieron leer las fotos:', e); }
}

function fotoDe(p){ return fotos[claveFoto(p.sku)] || ''; }

function normalizar(t){
  // los Excel traen espacios duros; se unifican para que las reglas coincidan
  return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
}
function categoriaDe(p){
  if(p._cat) return p._cat;
  const t = normalizar(p.descripcion||'') + ' # ' + normalizar(p.sku||'');
  for(const [nombre,rx] of CATEGORIAS){
    if(rx.test(t)){ p._cat = nombre; return nombre; }
  }
  p._cat = OTROS;
  return OTROS;
}

function estadoStock(s){ return s>20?'mucho':s>=10?'medio':s>=1?'poco':'no'; }
const estadoLabel = {mucho:'Mucho',medio:'Medio',poco:'Poco',no:'Sin stock'};
// La base guarda la columna como "proveedor"; de cara al usuario se llama marca.
const marcaLabel = {gamma:'Gamma',lusqtoff:'Lusqtoff',omaha:'Omaha',kld:'KLD'};
function fmtFecha(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function loadBin(prov){
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/productos?proveedor=eq.${prov}&select=productos,last_update`,{
      headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
    });
    if(!r.ok) return;
    const rows = await r.json();
    const row = rows[0];
    data[prov] = (row && row.productos) || [];
    if(row && row.last_update && (!lastUpdate || row.last_update > lastUpdate)) lastUpdate = row.last_update;
  }catch(e){ console.error(prov, e); }
}

async function saveBin(prov, productos){
  const ts = new Date().toISOString();
  const check = await fetch(`${SUPABASE_URL}/rest/v1/productos?proveedor=eq.${prov}&select=id`,{
    headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}
  });
  const existing = await check.json();
  if(existing && existing.length){
    await fetch(`${SUPABASE_URL}/rest/v1/productos?id=eq.${existing[0].id}`,{
      method:'PATCH',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=minimal'},
      body:JSON.stringify({productos, last_update: ts})
    });
  }else{
    await fetch(`${SUPABASE_URL}/rest/v1/productos`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'return=minimal'},
      body:JSON.stringify({proveedor: prov, productos, last_update: ts})
    });
  }
  lastUpdate = ts;
}

// Detecta fila de encabezado buscando "código". Si no la encuentra
// (como en los archivos de Lusqtoff, que no traen encabezado),
// cae a lectura por posición fija de columna.
function parseSheet(rows, prov){
  let hi=-1, cols={};
  for(let i=0;i<rows.length;i++){
    const row=rows[i]||[];
    const idx=row.findIndex(c=>typeof c==='string'&&c.trim().toLowerCase().startsWith('código'));
    if(idx!==-1){
      hi=i;
      row.forEach((cell,ci)=>{
        if(typeof cell!=='string')return;
        const c=cell.trim().toLowerCase();
        if(c.startsWith('código'))cols.codigo=ci;
        if(c.startsWith('descripci'))cols.descripcion=ci;
        if(c.startsWith('precio vta'))cols.precio=ci;
        if(c.startsWith('stock dispo'))cols.stock=ci;
      });
      break;
    }
  }

  const out=[];

  if(hi!==-1){
    // Formato CON fila de encabezado
    for(let i=hi+1;i<rows.length;i++){
      const row=rows[i]||[];
      const codigo=row[cols.codigo];
      if(!codigo||typeof codigo!=='string'||!codigo.trim())continue;
      if(codigo.toLowerCase().includes('moneda costo'))continue;
      const sv=row[cols.stock],pv=row[cols.precio];
      out.push({
        sku:codigo.trim(),
        descripcion:(row[cols.descripcion]||'').toString().trim(),
        precio:typeof pv==='number'?pv:parseFloat(pv)||0,
        stock:typeof sv==='number'?sv:parseFloat(sv)||0,
        proveedor:prov
      });
    }
  } else {
    // Formato SIN encabezado (ej: export de RP Sistemas para Lusqtoff)
    // Columnas fijas: A=código(0)  C=descripción(2)  F=precio(5)  G=stock(6)
    for(let i=0;i<rows.length;i++){
      const row=rows[i]||[];
      const codigo=row[0];
      if(!codigo||typeof codigo!=='string'||!codigo.trim())continue;
      if(codigo.toLowerCase().includes('moneda costo'))continue;
      const sv=row[6],pv=row[5];
      out.push({
        sku:codigo.trim(),
        descripcion:(row[2]||'').toString().trim(),
        precio:typeof pv==='number'?pv:parseFloat(pv)||0,
        stock:typeof sv==='number'?sv:parseFloat(sv)||0,
        proveedor:prov
      });
    }
  }
  return out;
}

document.querySelectorAll('.upload-section input[type=file]').forEach(input=>{
  input.addEventListener('change', async function(){
    const prov = this.dataset.prov;
    const file = this.files[0];
    if(!file) return;
    const statusEl = document.getElementById('status-'+prov);
    const boxEl = document.getElementById('box-'+prov);
    statusEl.className='upload-status saving';
    statusEl.textContent='Leyendo archivo...';
    const reader = new FileReader();
    reader.onload = async function(evt){
      try{
        const wb = XLSX.read(new Uint8Array(evt.target.result),{type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet,{header:1,raw:true,defval:null});
        const productos = parseSheet(rows, prov);
        statusEl.textContent=`Guardando ${productos.length} productos...`;
        await saveBin(prov, productos);
        data[prov] = productos;
        statusEl.className='upload-status ok';
        statusEl.textContent=`✓ ${productos.length} productos guardados`;
        boxEl.classList.add('loaded');
        render();
      }catch(e){
        statusEl.className='upload-status error';
        statusEl.textContent='Error al procesar el archivo';
        console.error(e);
      }
    };
    reader.readAsArrayBuffer(file);
  });
});

function getAllProductos(){
  return [...data.gamma, ...data.lusqtoff, ...data.omaha, ...data.kld];
}

function pintarSecciones(todos){
  const cuenta = {}, conStock = {};
  todos.forEach(p=>{
    const c = categoriaDe(p);
    cuenta[c] = (cuenta[c]||0)+1;
    if(p.stock>0) conStock[c] = (conStock[c]||0)+1;
  });
  const orden = [...new Set(CATEGORIAS.map(c=>c[0]))].concat([OTROS]);
  document.getElementById('cats').innerHTML = orden.filter(c=>cuenta[c]).map(c=>`
    <button class="cat" data-cat="${c}" style="--c:${COLORES[c]||'#6b7280'}">
      <div class="cn">${c}</div>
      <div class="cc"><b>${conStock[c]||0}</b> con stock · ${cuenta[c]} en total</div>
    </button>`).join('');
}

function abrirSeccion(c){
  seccion = c;
  limite = PASO;
  document.getElementById('search').value = '';
  document.getElementById('filterEstado').value = '';
  document.getElementById('filterProv').value = '';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(){
  const todos = getAllProductos();
  const search = document.getElementById('search').value.toLowerCase();
  const filtroEst = document.getElementById('filterEstado').value;
  const filtroProv = document.getElementById('filterProv').value;

  if(!todos.length){
    document.getElementById('stats').style.display='none';
    document.getElementById('controls').style.display='none';
    document.getElementById('table').style.display='none';
    document.getElementById('moreBtn').style.display='none';
    document.getElementById('emptyState').style.display='none';
    document.getElementById('loadingState').style.display='block';
    document.getElementById('loadingState').textContent='Todavía no hay stock cargado.';
    document.getElementById('subtitle').textContent='Sin datos';
    return;
  }

  document.getElementById('subtitle').textContent=`${todos.length} productos · actualizado ${fmtFecha(lastUpdate)}`;
  document.getElementById('loadingState').style.display='none';

  // El listado arranca en la seccion abierta; en la principal, en todo el catalogo
  const base = seccion ? todos.filter(p=>categoriaDe(p)===seccion) : todos;

  const counts={mucho:0,medio:0,poco:0,no:0};
  base.forEach(p=>counts[estadoStock(p.stock)]++);
  document.getElementById('statTotal').textContent=base.length;
  document.getElementById('statMucho').textContent=counts.mucho;
  document.getElementById('statMedio').textContent=counts.medio;
  document.getElementById('statPoco').textContent=counts.poco;
  document.getElementById('statNo').textContent=counts.no;
  document.getElementById('stats').style.display = isAdmin?'grid':'none';

  const enPortada = !seccion && !search;
  document.getElementById('home').style.display = enPortada?'block':'none';
  document.getElementById('secbar').style.display = seccion?'flex':'none';
  document.getElementById('secTitle').textContent = seccion||'';
  document.getElementById('controls').style.display='flex';
  // En la pantalla principal solo hace falta el buscador
  document.getElementById('filterEstado').style.display = enPortada?'none':'block';
  document.getElementById('filterProv').style.display = enPortada?'none':'block';

  if(enPortada){
    pintarSecciones(todos);
    document.getElementById('table').style.display='none';
    document.getElementById('moreBtn').style.display='none';
    document.getElementById('emptyState').style.display='none';
    return;
  }

  const filtered=base.filter(p=>{
    return(!search||p.sku.toLowerCase().includes(search)||p.descripcion.toLowerCase().includes(search))
      &&(!filtroEst||estadoStock(p.stock)===filtroEst)
      &&(!filtroProv||p.proveedor===filtroProv);
  });

  // Mayor stock primero; los que no tienen stock quedan al final.
  filtered.sort((a,b)=>(b.stock||0)-(a.stock||0));

  if(!filtered.length){
    document.getElementById('table').style.display='none';
    document.getElementById('moreBtn').style.display='none';
    document.getElementById('emptyState').textContent = seccion
      ? `Sin resultados en ${seccion}. Probá volver a las secciones y buscar en todo el catálogo.`
      : 'Sin resultados para esa búsqueda.';
    document.getElementById('emptyState').style.display='block';
    return;
  }
  document.getElementById('emptyState').style.display='none';
  document.getElementById('table').style.display='table';

  const visibles = filtered.slice(0, limite);
  const moreBtn = document.getElementById('moreBtn');
  if(filtered.length > limite){
    moreBtn.style.display='block';
    moreBtn.textContent=`Mostrar más (${visibles.length} de ${filtered.length})`;
  }else{
    moreBtn.style.display='none';
  }

  // La columna de fotos aparece sola cuando hay fotos cargadas en Supabase
  const hayFotos = Object.keys(fotos).length > 0;
  document.getElementById('thFoto').style.display = hayFotos?'':'none';

  document.getElementById('tbody').innerHTML=visibles.map(p=>{
    const est=estadoStock(p.stock);
    const f = hayFotos ? fotoDe(p) : '';
    return `<tr>
      ${hayFotos ? `<td>${f?`<img class="thumb" src="${f}" loading="lazy" decoding="async" alt="" data-sku="${p.sku}">`:''}</td>` : ''}
      <td class="sku">${p.sku}</td>
      <td>${p.descripcion}</td>
      <td><span class="marca">${marcaLabel[p.proveedor]||p.proveedor}</span></td>
      <td class="precio">$${p.precio.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td><span class="badge ${est}"><span class="dot"></span>${estadoLabel[est]}</span></td>
    </tr>`;
  }).join('');
}

// Cuantos productos ya tienen foto, para seguir el avance de la carga
function infoFotos(){
  const todos = getAllProductos();
  const con = todos.filter(p=>fotoDe(p)).length;
  const el = document.getElementById('fotoInfo');
  if(!Object.keys(fotos).length){
    el.innerHTML = `Todavía no hay fotos. Creá el bucket público <b>${BUCKET_FOTOS}</b> en Supabase Storage y subí las imágenes con el SKU como nombre de archivo.`;
    return;
  }
  const falta = todos.length - con;
  el.innerHTML = `Fotos: <b>${con}</b> de ${todos.length} productos (${Math.round(100*con/todos.length)}%). Faltan <b>${falta}</b>.`;
}

function checkPw(){
  if(document.getElementById('pwInput').value===ADMIN_PASS){
    isAdmin=true;
    document.getElementById('pwModal').classList.remove('open');
    document.getElementById('uploadSection').style.display='block';
    document.getElementById('adminToggle').textContent='Salir';
    infoFotos();
    render();
  }else{
    document.getElementById('pwError').style.display='block';
  }
}

// Carrusel de la portada: los carteles van rotando solos
(function(){
  const hero=document.getElementById('hero');
  if(!hero) return;
  const imgs=[...hero.querySelectorAll('img')];
  if(imgs.length<2){ const p=document.getElementById('heroPuntos'); if(p) p.remove(); return; }
  const cont=document.getElementById('heroPuntos');
  imgs.forEach((_,i)=>{
    const b=document.createElement('b');
    if(i===0) b.className='on';
    b.addEventListener('click',()=>mostrar(i));
    cont.appendChild(b);
  });
  const puntos=[...cont.children];
  let act=0, timer=null;
  function mostrar(i){
    act=(i+imgs.length)%imgs.length;
    imgs.forEach((im,k)=>im.classList.toggle('on',k===act));
    puntos.forEach((b,k)=>b.classList.toggle('on',k===act));
    reiniciar();
  }
  function reiniciar(){ clearInterval(timer); timer=setInterval(()=>mostrar(act+1),5000); }
  reiniciar();
  // no gastar batería ni datos cuando la pestaña no se ve
  document.addEventListener('visibilitychange',()=>{ document.hidden?clearInterval(timer):reiniciar(); });
})();

  render();
});
